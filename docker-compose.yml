services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: file:./data/taskfleet.db
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-60000}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_BASE_BRANCH: ${GITHUB_BASE_BRANCH:-main}
      WORKTREES_ENABLED: "false"
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-3}
      SECURITY_ENABLED: ${SECURITY_ENABLED:-false}
      SECURITY_POLICY: ${SECURITY_POLICY:-fail-closed}
      SECURITY_SCANNERS: ${SECURITY_SCANNERS:-gitleaks,semgrep,trivy}
      SECURITY_SCAN_TIMEOUT_MS: ${SECURITY_SCAN_TIMEOUT_MS:-120000}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-TaskFleet Agent}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-agent@taskfleet.local}
    volumes:
      - taskfleet-data:/app/apps/api/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  taskfleet-data:
